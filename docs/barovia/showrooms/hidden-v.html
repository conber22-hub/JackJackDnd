<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Barovia V: Under the Road | 3D showroom</title><style>
:root{color-scheme:dark;background:#0a1012;color:#dfdfd5;font-family:system-ui,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;overflow:hidden}
#stage{width:100vw;height:100vh;display:block}aside{position:fixed;top:16px;left:16px;background:#111e20e9;max-width:min(420px,calc(100vw - 32px));padding:19px;border:1px solid #455552;border-radius:12px;box-shadow:0 12px 36px #000a}
h1{font-size:1.25rem;margin:0 0 6px;letter-spacing:.07em}p{color:#b2c1bb;line-height:1.45;font-size:.91rem}label{display:block;font-size:.82rem;color:#abc1b8;margin:12px 0 4px}select,button{border-radius:6px;background:#1d3233;color:#e8ebe7;border:1px solid #63847a;padding:10px;font:inherit}select{width:100%}button{cursor:pointer;min-width:120px;margin-top:10px}button:hover{background:#2d4848}#info{margin-top:11px;font-size:.84rem}small{color:#889f97}#loading{position:absolute;bottom:20px;left:20px;color:#d6decf}
</style></head><body>
<div id="stage"></div><aside><h1>BAROVIA V: UNDER THE ROAD</h1><p>12 concealed entrances. Each has a revealed variant. Models are original, five-foot-grid scale, and visual-only.</p><label for="site">Site</label><select id="site"></select><div><button id="toggle">REVEAL ENTRANCE</button><button id="rotate">TURN VIEW</button></div><p id="info"></p><small>This preview does not alter game collision, navigation or dungeon links.</small></aside><div id="loading">Loading original GLB...</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const root=document.getElementById('stage');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;root.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#0e1719');scene.fog=new THREE.Fog('#0e1719',12,34);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,80);camera.position.set(5.9,5.4,7.2);const ctl=new OrbitControls(camera,renderer.domElement);ctl.target.set(0,.5,0);ctl.enableDamping=true;ctl.maxPolarAngle=1.49;ctl.update();
scene.add(new THREE.HemisphereLight('#b4bed0','#29312c',2.1));const moon=new THREE.DirectionalLight('#dde5ee',2.0);moon.position.set(-3,8,6);scene.add(moon);const ground=new THREE.Mesh(new THREE.PlaneGeometry(22,22),new THREE.MeshStandardMaterial({color:'#242b26',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.135;scene.add(ground);
const grid=new THREE.GridHelper(14,14,0x37504b,0x31433c);grid.position.y=-.13;scene.add(grid);
const loader=new GLTFLoader();const select=document.querySelector('#site');const toggle=document.querySelector('#toggle'),info=document.querySelector('#info'),loading=document.querySelector('#loading');const manifest=await fetch('/assets/hidden-sites/manifest.json').then(r=>{if(!r.ok)throw Error('Manifest missing: run the Vite dev server');return r.json();});
for(const site of manifest.pairs){const o=document.createElement('option');o.value=site.id;o.textContent=site.title;select.appendChild(o);}
let shown=null,revealed=false,version=0;async function draw(){const v=++version;const s=manifest.pairs.find(x=>x.id===select.value);loading.textContent='Loading '+s.title+'...';const url='/assets/hidden-sites/'+s.id+'_'+(revealed?'revealed':'sealed')+'.glb';try{const o=await loader.loadAsync(url);if(v!==version)return;if(shown)scene.remove(shown);shown=o.scene;scene.add(shown);toggle.textContent=revealed?'CONCEAL ENTRANCE':'REVEAL ENTRANCE';info.innerHTML='<strong>'+s.title+'</strong><p>'+(revealed?s.reveal:s.approach)+'</p>';loading.textContent='';}catch(e){loading.textContent=e.message;}}
select.onchange=()=>{revealed=false;draw();};toggle.onclick=()=>{revealed=!revealed;draw();};document.querySelector('#rotate').onclick=()=>{camera.position.set(-camera.position.x,camera.position.y,-camera.position.z);};select.value=manifest.pairs[0].id;draw();
function frame(){requestAnimationFrame(frame);ctl.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
</script></body></html>
